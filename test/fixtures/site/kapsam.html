<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123456">
<title>Tam ekran uygulama</title>
<!-- cross-origin, crossorigin özniteliği YOK → CSSOM'dan okunamaz -->
<link rel="stylesheet" href="http://localhost:8898/guvenli.css">
<style>
  body { margin: 0; font: 15px system-ui; background: #123456; color: #fff }
  header { padding-top: env(safe-area-inset-top, 7px); background: #123456 }
  .yan { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right) }
  @media (min-width: 0px) { .ic { margin-top: calc(env(safe-area-inset-top) + 1px) } }
</style></head><body>
<header id="ust"><h1>Uygulama</h1></header>
<div class="yan" id="yan">yan boşluklar</div>
<div class="ic" id="ic">iç içe kural</div>
<div id="satir" style="padding-bottom: env(safe-area-inset-bottom)">satır içi</div>
<footer id="alt">alt çubuk</footer>
<div id="gec">geç stil</div>
<script>
  /* SPA gibi: stil sonradan eklenir */
  setTimeout(() => {
    const s = document.createElement('style')
    s.textContent = '#gec { --alt: env(safe-area-inset-bottom); padding-bottom: var(--alt) }'
    document.head.appendChild(s)
  }, 300)
  window.olc = () => {
    const p = (id, k) => parseFloat(getComputedStyle(document.getElementById(id))[k])
    return { ust: p('ust', 'paddingTop'), sol: p('yan', 'paddingLeft'), sag: p('yan', 'paddingRight'),
      ic: p('ic', 'marginTop'), satir: p('satir', 'paddingBottom'), alt: p('alt', 'paddingBottom'),
      gec: p('gec', 'paddingBottom'), h: innerHeight }
  }
</script></body></html>
